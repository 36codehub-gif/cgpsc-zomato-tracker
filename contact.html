<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Nilkanth Patel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <aside class="sidebar">
        <div class="profile-container">
            <img src="file_00000000afb882078d9ea8c5518d6cb4.png" alt="Nilkanth Patel" class="profile-img">
            <h2>Nilkanth Patel</h2>
            <p>Software Engineer</p>
        </div>
        <nav class="nav-menu">
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="about.html" class="nav-link"><i class="fa-solid fa-user"></i> About Me</a>
            <a href="projects.html" class="nav-link"><i class="fa-solid fa-code"></i> Projects</a>
            <a href="contact.html" class="nav-link active"><i class="fa-solid fa-envelope"></i> Contact</a>
        </nav>
        <div class="social-links">
            <a href="https://github.com" target="_blank"><i class="fa-brands fa-github"></i></a>
            <a href="https://linkedin.com" target="_blank"><i class="fa-brands fa-linkedin"></i></a>
            <a href="mailto:nilkanthpatel.office@gmail.com"><i class="fa-solid fa-envelope"></i></a>
        </div>
    </aside>

    <main class="main-content">
        <section class="page-header">
            <h1>Get In <span class="highlight">Touch</span></h1>
            <p>Let's collaborate on software engineering projects or open opportunities.</p>
        </section>

        <div class="contact-layout">
            <div class="contact-info">
                <div class="info-card">
                    <i class="fa-solid fa-phone"></i>
                    <div>
                        <h4>Phone Number</h4>
                        <p>+91 91111717276</p>
                    </div>
                </div>

                <div class="info-card">
                    <i class="fa-solid fa-envelope"></i>
                    <div>
                        <h4>Email Address</h4>
                        <p>nilkanthpatel.office@gmail.com</p>
                    </div>
                </div>

                <div class="info-card">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <div>
                        <h4>Qualification</h4>
                        <p>BCA Computer Science</p>
                    </div>
                </div>
            </div>

            <form id="contact-form" class="contact-form">
                <h3>Send a Message</h3>
                <div class="form-group">
                    <input type="text" id="name" placeholder="Your Name" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="Your Email" required>
                </div>
                <div class="form-group">
                    <input type="text" id="subject" placeholder="Subject" required>
                </div>
                <div class="form-group">
                    <textarea id="message" rows="5" placeholder="Your Message" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
